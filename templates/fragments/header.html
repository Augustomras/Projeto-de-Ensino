<header class="page-header">
    <div class="header-title">
        <h1>{{ page_title }}</h1>
    </div>

    <div class="header-actions">
        <form class="search-box" method="GET" action="{% url 'core:buscar' %}">
            <i data-lucide="search"></i>

            <input
                type="text"
                name="q"
                placeholder="Buscar livros, autores, países ou leitores..."
                value="{{ request.GET.q }}"
            >
        </form>
    </div>
</header>
