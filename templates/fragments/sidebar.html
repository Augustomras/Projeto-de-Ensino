<aside class="sidebar">
    <div class="sidebar-header">
        
        <a href="{% url 'core:home' %}" class="logo-link">
            <div class="logo">
                <span class="logo-mark">K</span>
                <span class="logo-text">Koobtil</span>
            </div>
        </a>
    </div>

    <nav class="sidebar-nav">
        <a href="{% url 'core:home' %}"
           class="nav-item {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
            <i data-lucide="house"></i>
            <span>Início</span>
        </a>

        <a href="{% url 'core:explorar' %}"
           class="nav-item {% if request.resolver_match.url_name == 'explorar' %}active{% endif %}">
            <i data-lucide="compass"></i>
            <span>Explorar</span>
        </a>

        <a href="{% url 'core:perfil' %}"
           class="nav-item {% if request.resolver_match.url_name == 'perfil' %}active{% endif %}">
            <i data-lucide="user-round"></i>
            <span>Perfil</span>
        </a>

        {% if user.is_authenticated and user.is_staff %}
            <a href="{% url 'core:admin_denuncias' %}" class="nav-item">
                <i data-lucide="flag"></i>
                <span>Denúncias</span>
            </a>
        {% endif %}

        {% if user.is_authenticated %}
            <form method="post" action="{% url 'logout' %}" class="nav-item-form">
                {% csrf_token %}
                <button type="submit" class="nav-item nav-item-button">
                    <i data-lucide="log-out"></i>
                    <span>Sair</span>
                </button>
            </form>
        {% else %}
            <a href="{% url 'login' %}" class="nav-item">
                <i data-lucide="log-in"></i>
                <span>Entrar</span>
            </a>
            <a href="{% url 'core:cadastro' %}" class="nav-item">
                <i data-lucide="user-plus"></i>
                <span>Cadastrar</span>
            </a>
        {% endif %}
    </nav>

    <div class="sidebar-footer">
        <a href="{% url 'core:adicionar_livro' %}"
           class="add-book-btn">
            <i data-lucide="plus"></i>
            <span>Adicionar livro</span>
        </a>
    </div>
</aside>
